[build-system]
requires = [
    "pdm-backend",
]
build-backend = "pdm.backend"

[project]
authors = []
requires-python = ">=3.9.0,<4.0.0"
dependencies = [
    "langchain-core>=0.3.85,<1.0.0",
    "langchain-text-splitters>=0.3.9,<1.0.0",
    "langsmith>=0.1.17,<1.0.0",
    "pydantic>=2.7.4,<3.0.0",
    "SQLAlchemy>=1.4.0,<3.0.0",
    "requests>=2.0.0,<3.0.0",
    "PyYAML>=5.3.0,<7.0.0",
    "async-timeout>=4.0.0,<5.0.0; python_version < \"3.11\"",
]
name = "langchain"
version = "0.3.30"
description = "Building applications with LLMs through composability"
readme = "README.md"

[project.license]
text = "MIT"

[project.optional-dependencies]
community = [
    "langchain-community",
]
anthropic = [
    "langchain-anthropic",
]
openai = [
    "langchain-openai",
]
azure-ai = [
    "langchain-azure-ai",
]
cohere = [
    "langchain-cohere",
]
google-vertexai = [
    "langchain-google-vertexai",
]
google-genai = [
    "langchain-google-genai",
]
fireworks = [
    "langchain-fireworks",
]
ollama = [
    "langchain-ollama",
]
together = [
    "langchain-together",
]
mistralai = [
    "langchain-mistralai",
]
huggingface = [
    "langchain-huggingface",
]
groq = [
    "langchain-groq",
]
aws = [
    "langchain-aws",
]
deepseek = [
    "langchain-deepseek",
]
xai = [
    "langchain-xai",
]
perplexity = [
    "langchain-perplexity",
]

[project.urls]
"Source Code" = "https://github.com/langchain-ai/langchain/tree/master/libs/langchain"
"Release Notes" = "https://github.com/langchain-ai/langchain/releases?q=tag%3A%22langchain%3D%3D0%22&expanded=true"
repository = "https://github.com/langchain-ai/langchain"

[dependency-groups]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "pytest-dotenv>=0.5.2,<1.0.0",
    "duckdb-engine>=0.9.2,<1.0.0",
    "pytest-watcher>=0.2.6,<1.0.0",
    "freezegun>=1.2.2,<2.0.0",
    "responses>=0.22.0,<1.0.0",
    "pytest-asyncio>=0.23.2,<1.0.0",
    "lark>=1.1.5,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "pytest-socket>=0.6.0,<1.0.0",
    "syrupy>=4.0.2,<5.0.0",
    "requests-mock>=1.11.0,<2.0.0",
    "pytest-xdist<4.0.0,>=3.6.1",
    "blockbuster>=1.5.18,<1.6.0",
    "cffi<1.17.1; python_version < \"3.10\"",
    "cffi; python_version >= \"3.10\"",
    "langchain-tests",
    "langchain-core",
    "langchain-text-splitters",
    "langchain-openai",
    "toml>=0.10.2,<1.0.0",
    "packaging>=24.2.0,<26.0.0",
    "numpy>=1.26.4; python_version<'3.13'",
    "numpy>=2.1.0; python_version>='3.13'",
]
test_integration = [
    "vcrpy>=7.0.0,<8.0.0",
    "urllib3<2.0.0; python_version < \"3.10\"",
    "wrapt>=1.15.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "langchain-core",
    "langchain-text-splitters",
]
lint = [
    "ruff>=0.13.1,<0.14.0",
    "cffi<1.17.1; python_version < \"3.10\"",
    "cffi; python_version >= \"3.10\"",
]
typing = [
    "mypy>=1.15.0,<1.16.0",
    "types-pyyaml>=6.0.12.2,<7.0.0.0",
    "types-requests>=2.28.11.5,<3.0.0.0",
    "types-toml>=0.10.8.1,<1.0.0.0",
    "types-redis>=4.3.21.6,<5.0.0.0",
    "types-pytz>=2023.3.0.0,<2024.0.0.0",
    "types-chardet>=5.0.4.6,<6.0.0.0",
    "mypy-protobuf>=3.0.0,<4.0.0",
    "langchain-core",
    "langchain-text-splitters",
    "numpy>=1.26.4; python_version < '3.13'",
    "numpy>=2.1.0; python_version >= '3.13'",
]
dev = [
    "setuptools>=67.6.1,<68.0.0",
    "langchain-core",
    "langchain-text-splitters",
]

[tool.uv.sources.langchain-core]
path = "../core"
editable = true

[tool.uv.sources.langchain-tests]
path = "../standard-tests"
editable = true

[tool.uv.sources.langchain-text-splitters]
path = "../text-splitters"
editable = true

[tool.uv.sources.langchain-openai]
path = "../partners/openai"
editable = true

[tool.ruff]
target-version = "py39"
exclude = [
    "tests/integration_tests/examples/non-utf8-encoding.py",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "ALL",
]
ignore = [
    "C90",
    "COM812",
    "FIX002",
    "PERF203",
    "PLR09",
    "RUF012",
    "TC001",
    "TC002",
    "TC003",
    "TD002",
    "TD003",
    "ANN401",
    "D100",
    "PLC0415",
    "TRY301",
]
unfixable = [
    "B028",
    "PLW1510",
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "langchain_core.load.serializable.Serializable",
    "langchain_core.runnables.base.RunnableSerializable",
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = [
    "classmethod",
    "langchain_core.utils.pre_init",
    "pydantic.field_validator",
    "pydantic.v1.root_validator",
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-var-parameters = true

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
    "D1",
    "S101",
    "S311",
    "SLF001",
    "PLR2004",
]
"tests/integration_tests/examples/*.py" = [
    "INP001",
    "EXE001",
]
"scripts/*.py" = [
    "INP001",
]
"langchain/chains/constitutional_ai/principles.py" = [
    "E501",
]
"**/retrievers/*time_weighted_retriever.py" = [
    "DTZ001",
    "DTZ005",
    "DTZ006",
]
"**/__init__.py" = [
    "D104",
]

[tool.mypy]
plugins = [
    "pydantic.mypy",
]
strict = "True"
strict_bytes = "True"
ignore_missing_imports = "True"
enable_error_code = "deprecated"
report_deprecated_as_note = "True"
warn_unreachable = "True"
disallow_untyped_calls = "False"
disallow_any_generics = "False"
disallow_untyped_decorators = "False"
warn_return_any = "False"
strict_equality = "False"

[tool.coverage.run]
omit = [
    "tests/*",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5 --snapshot-warn-unused -vv"
markers = [
    "requires: mark tests as requiring a specific library",
    "scheduled: mark tests to run in scheduled testing",
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::langchain_core._api.beta_decorator.LangChainBetaWarning",
    "ignore::langchain_core._api.deprecation.LangChainDeprecationWarning:tests",
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning:tests",
]

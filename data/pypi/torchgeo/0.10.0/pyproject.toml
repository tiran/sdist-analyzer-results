[build-system]
requires = ["uv_build>=0.7,<0.13"]
build-backend = "uv_build"

[project]
name = "torchgeo"
version = "0.10.0"
description = "TorchGeo: datasets, samplers, transforms, and pre-trained models for geospatial data"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "pytorch",
    "deep learning",
    "machine learning",
    "remote sensing",
    "satellite imagery",
    "earth observation",
    "geospatial",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "einops>=0.3",
    "geopandas>=1.0",
    "jsonargparse[jsonnet,signatures]>=4.39",
    "kornia>=0.8.2",
    "lightly>=1.5.1",
    "lightning>=2.4,!=2.5.0,!=2.5.5,!=2.5.6",
    "matplotlib>=3.7.3",
    "numpy>=1.26",
    "pandas>=2.1.1",
    "pillow>=10",
    "pyogrio>=0.10",
    "pyproj>=3.6.1",
    "rasterio>=1.4.3",
    "requests>=2.25",
    "segmentation-models-pytorch>=0.5",
    "shapely>=2.0.2",
    "timm>=1.0.3",
    "torch>=2.2",
    "torchmetrics[detection]>=1.5",
    "torchvision>=0.17",
    "tqdm>=4.57",
    "typing-extensions>=4.8",
]

[[project.authors]]
name = "Adam J. Stewart"
email = "ajstewart426@gmail.com"

[[project.maintainers]]
name = "Adam J. Stewart"
email = "ajstewart426@gmail.com"

[[project.maintainers]]
name = "Caleb Robinson"
email = "Caleb.Robinson@microsoft.com"

[[project.maintainers]]
name = "Isaac Corley"
email = "isaac.corley@proton.me"

[[project.maintainers]]
name = "Nils Lehmann"
email = "n.lehmann@tum.de"

[[project.maintainers]]
name = "Ashwin Nair"
email = "ashnair0007@gmail.com"

[[project.maintainers]]
name = "Robin Cole"
email = "robmarkcole@gmail.com"

[project.optional-dependencies]
datasets = [
    "h5py>=3.10,<3.15; python_version<'3.14'",
    "laspy>=2.5.3",
    "netcdf4>=1.6.5",
    "pandas[parquet]>=2.1.1",
    "rioxarray>=0.14.1",
    "scipy>=1.11.2",
    "tokenizers>=0.14; python_version<'3.14'",
    "webdataset>=0.2.101",
    "xarray>=0.17",
]
docs = [
    "ipywidgets>=7",
    "myst-parser>=5.1",
    "nbsphinx>=0.8.5",
    "pydata-sphinx-theme>=0.18",
    "sphinx>=8",
    "sphinx-github-changelog>=2",
]
models = [
    "microsoft-aurora>=1.6",
    "olmoearth-pretrain-minimal>=0.0.2",
]
style = [
    "pandas-stubs>=2.1.1",
    "ruff>=0.16",
    "ty>=0.0.62",
    "types-geopandas>=1.0",
    "types-rasterio>=1.5.0.20260728",
    "types-requests>=2.25",
    "types-shapely>=2.0.2",
]
tests = [
    "nbmake>=1.4.5",
    "packaging>=21",
    "pytest>=7.3.2",
    "pytest-cov>=4",
    "pytest-socket>=0.3.4",
]
all = ["torchgeo[datasets,docs,models,style,tests]"]

[project.scripts]
torchgeo = "torchgeo.main:main"

[project.urls]
Codecov = "https://app.codecov.io/gh/torchgeo/torchgeo"
Documentation = "https://docs.torchgeo.org"
Homepage = "https://github.com/torchgeo/torchgeo"
Slack = "https://torchgeo.slack.com"

[tool.coverage.report]
exclude_also = ["@overload"]
show_missing = true

[tool.pytest.ini_options]
addopts = "-m 'not slow' --disable-socket"
filterwarnings = [
    'ignore:The global interpreter lock \(GIL\) has been enabled to load module:RuntimeWarning',
    'ignore:`isinstance\(treespec, LeafSpec\)` is deprecated, use `isinstance\(treespec, TreeSpec\) and treespec.is_leaf\(\)` instead.:FutureWarning',
    "ignore:Default grid_sample and affine_grid behavior has changed to align_corners=False since 1.3.0:UserWarning",
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
    "ignore:__array_wrap__ must accept context and return_scalar arguments:DeprecationWarning",
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3.14 or greater.:UserWarning",
    "ignore:ForwardRef._evaluate is a private API and is retained for compatibility:DeprecationWarning",
    'ignore:`torch.jit.script` is not supported in Python 3.14\+ and may break.:DeprecationWarning',
    "ignore:`torch.jit.script` is deprecated. Please switch to `torch.compile` or `torch.export`.:DeprecationWarning",
    "ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2.5:DeprecationWarning",
    "ignore:The .*dataloader.* does not have many workers which may be a bottleneck:UserWarning",
    "ignore:GPU available but not used.:UserWarning",
    "ignore:Starting from v1.9.0, `tensorboardX` has been removed as a dependency of the `lightning.pytorch` package:UserWarning",
    "ignore:LightningCLI's args parameter is intended to run from within Python like if it were from the command line.:UserWarning",
    "ignore:divide by zero encountered in oriented_envelope:RuntimeWarning",
    "ignore:invalid value encountered in oriented_envelope:RuntimeWarning",
]
markers = ["slow: marks tests as slow"]
norecursedirs = [
    ".ipynb_checkpoints",
    "data",
    "__pycache__",
]
testpaths = [
    "tests",
    "docs/tutorials",
]
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.ruff]
fix = true

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
    "ANN",
    "CPY",
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"docs/**" = [
    "ANN",
    "D",
]
"tests/**" = ["D"]

[tool.ruff.lint.flake8-copyright]
author = "TorchGeo Contributors"
notice-rgx = 'Copyright \(c\)'

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
deprecated = "ignore"
unresolved-attribute = "ignore"
unresolved-import = "ignore"

[tool.ty.src]
include = [
    "torchgeo",
    "tests",
]
exclude = ["tests/data"]

[tool.ty.terminal]
error-on-warning = false

[tool.uv.build-backend]
module-root = ""

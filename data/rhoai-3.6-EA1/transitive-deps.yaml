# Transitive shared library dependencies for vendor/undecided libraries
# Generated by dump-transitive-deps.py on a RHEL 9.6 + RHELAI (x86_64) system
# Libraries in the manylinux_2_34 baseline are filtered out
#
# Classification key:
#   system     -- consumed from system, not bundled
#   vendor     -- bundled into wheel
#   bundleable -- can be bundled (in _BUNDLEABLE_LIBS)
#   undecided  -- not yet classified

# ============================================================
# vendor libraries
# ============================================================

# -- text processing --

libre2.so.9:
  classification: vendor
  transitive: []

libutf8proc.so.2:
  classification: vendor
  transitive: []

# -- data formats --

# libthrift: kept as vendor despite transitive libssl dep;
# bundled copy links against system OpenSSL at runtime
libthrift-0.15.0.so:
  classification: vendor
  note: transitive libssl/libcrypto dep; bundled copy uses system OpenSSL
  transitive:
    - libcrypto.so.3        # system (unbundleable)
    - libssl.so.3           # system (unbundleable)

# -- misc --

libev.so.4:
  classification: vendor
  transitive: []

libloguru.so.2:
  classification: vendor
  transitive: []

libyaml-0.so.2:
  classification: vendor
  transitive: []

# ============================================================
# bundleable libraries (can be bundled)
# ============================================================

# -- math / science --

libgfortran.so.5:
  classification: bundleable
  transitive: []

libqhull_r.so.7:
  classification: bundleable
  transitive: []

# -- color management --

liblcms2.so.2:
  classification: bundleable
  transitive: []

libmariadb.so.3:
  classification: bundleable
  note: transitive libssl/libcrypto dep
  transitive:
    - libcrypto.so.3        # system (unbundleable)
    - libssl.so.3           # system (unbundleable)

libpq.so.5:
  classification: bundleable
  note: transitive libssl/libcrypto/libkrb5 dep
  transitive:
    - libcrypto.so.3        # system (unbundleable)
    - libgssapi_krb5.so.2   # system (unbundleable)
    - libk5crypto.so.3      # system (unbundleable)
    - libkrb5.so.3          # system (unbundleable)
    - libkrb5support.so.0   # system (unbundleable)
    - libssl.so.3           # system (unbundleable)

libtbb.so.2:
  classification: bundleable
  transitive: []

libzip.so.5:
  classification: bundleable
  note: transitive libcrypto dep
  transitive:
    - libcrypto.so.3        # system (unbundleable)

libzmq.so.5:
  classification: bundleable
  note: transitive libssl/libkrb5 dep
  transitive:
    - libcrypto.so.3        # system (unbundleable)
    - libgssapi_krb5.so.2   # system (unbundleable)
    - libkrb5.so.3          # system (unbundleable)
    - libkrb5support.so.0   # system (unbundleable)

# ============================================================
# system libraries (consumed from system, not bundled)
# ============================================================

# -- image codecs (used by multiple packages, use system versions) --

libjpeg.so.62:
  classification: system
  transitive: []

libopenjp2.so.7:
  classification: system
  transitive: []

libpng16.so.16:
  classification: system
  transitive: []

libtiff.so.5:
  classification: system
  transitive:
    - libjbig.so.2.1
    - libjpeg.so.62
    - libwebp.so.7
    - libzstd.so.1

libwebp.so.7:
  classification: system
  transitive: []

libwebpdemux.so.2:
  classification: system
  transitive:
    - libwebp.so.7

libwebpmux.so.3:
  classification: system
  transitive:
    - libwebp.so.7

# -- compression (typically available on all systems) --

libzstd.so.1:
  classification: system
  transitive: []

libbz2.so.1:
  classification: system
  transitive: []

liblz4.so.1:
  classification: system
  transitive: []

liblzma.so.5:
  classification: system
  transitive: []

libsnappy.so.1:
  classification: system
  transitive: []

# -- XML / XSLT (security-sensitive, use system versions) --

libxml2.so.2:
  classification: system
  transitive:
    - liblzma.so.5          # system

libxslt.so.1:
  classification: system
  transitive:
    - liblzma.so.5          # system
    - libxml2.so.2          # system

libexslt.so.0:
  classification: system
  transitive:
    - liblzma.so.5          # system
    - libxml2.so.2          # system
    - libxslt.so.1          # system

# -- ABI-specific --

libffi.so.8:
  classification: system
  transitive: []

# -- font rendering (transitive: libharfbuzz, libpng, libbz2, libbrotli) --

libfreetype.so.6:
  classification: system
  transitive:
    - libbrotlicommon.so.1
    - libbrotlidec.so.1
    - libbz2.so.1           # system
    - libgraphite2.so.3
    - libharfbuzz.so.0
    - libpng16.so.16        # vendor

# -- GIS --

libgeos_c.so.1:
  classification: system
  note: requires libgeos (large C++ geometry engine)
  transitive:
    - libgeos.so.3.13.1

libproj.so.25:
  classification: system
  note: transitive libcurl -> libssl, libkrb5
  transitive:
    - libcrypto.so.3
    - libcurl.so.4
    - libgssapi_krb5.so.2
    - libjpeg.so.62
    - libk5crypto.so.3
    - libkrb5.so.3
    - libkrb5support.so.0
    - libnghttp2.so.14
    - libpcre2-8.so.0
    - libselinux.so.1
    - libsqlite3.so.0
    - libssl.so.3
    - libtiff.so.5
    - libwebp.so.7
    - libzstd.so.1

# -- networking (transitively depends on libssl / libkrb5) --

libcurl.so.4:
  classification: system
  transitive:
    - libcom_err.so.2
    - libcrypto.so.3
    - libgssapi_krb5.so.2
    - libk5crypto.so.3
